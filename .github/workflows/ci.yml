name: MediEval Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      showcase_only:
        description: Capture the real-image iOS example without running the full preflight
        type: boolean
        default: false

jobs:
  platform:
    if: ${{ !inputs.showcase_only }}
    name: Platform and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL tools for isolated smoke database
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: npm run oss:check
      - run: npm run demo:web:smoke
      - run: npm run platform:smoke
      - name: Build production platform image
        run: docker build -f services/platform/Dockerfile -t medieval-platform:ci .

  build:
    name: Build app
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate helper scripts
        run: bash -n scripts/preflight.sh

      - name: Run app preflight, simulator build, and launch
        if: ${{ !inputs.showcase_only }}
        env:
          MEDIEVAL_RUN_XCODE_BUILD: "1"
          MEDIEVAL_RUN_XCODE_LAUNCH: "1"
          MEDIEVAL_RUN_BUNDLE_VERIFY: "1"
          MEDIEVAL_SIMULATOR_USE_LOCAL_DEMO: "1"
          MEDIEVAL_SIMULATOR_DEMO_PROFILE: showcase
          MEDIEVAL_SIMULATOR_SCREENSHOT: ${{ runner.temp }}/medieval-demo.png
          MEDIEVAL_SIMULATOR_SCREENSHOT_DELAY: "3"
          MEDIEVAL_XCODE_DESTINATION: generic/platform=iOS Simulator
        run: ./scripts/preflight.sh

      - name: Capture real-image iOS showcase
        if: ${{ inputs.showcase_only }}
        timeout-minutes: 15
        env:
          MEDIEVAL_SIMULATOR_USE_LOCAL_DEMO: "1"
          MEDIEVAL_SIMULATOR_DEMO_PROFILE: showcase
          MEDIEVAL_SIMULATOR_SCREENSHOT: ${{ runner.temp }}/medieval-demo.png
          MEDIEVAL_SIMULATOR_SCREENSHOT_DELAY: "6"
        run: |
          node --test scripts/demo-showcase.test.mjs
          ./scripts/xcode-simulator-smoke.sh

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: medieval-simulator-demo
          path: ${{ runner.temp }}/medieval-demo.png
          if-no-files-found: error

      - name: Upload handoff bundle
        if: ${{ !inputs.showcase_only }}
        uses: actions/upload-artifact@v4
        with:
          name: medieval-ios-handoff
          path: dist/*.zip
          if-no-files-found: error
