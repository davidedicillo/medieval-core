name: MediEval Game Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test API and Postgres path
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medieval
          POSTGRES_USER: medieval
          POSTGRES_PASSWORD: medieval
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U medieval -d medieval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate helper scripts
        run: bash -n scripts/preflight.sh

      - name: Run unit and contract tests
        run: npm test

      - name: Smoke local memory API
        run: npm run smoke:memory

      - name: Run syntax checks
        run: npm run lint

      - name: Validate deployment manifests
        run: npm run verify:deploy

      - name: Build Docker image
        run: docker build -t medieval-game-service:ci .

      - name: Run migrations against Postgres
        env:
          DATABASE_URL: postgres://medieval:medieval@127.0.0.1:54329/medieval
        run: npm run migrate

      - name: Start API for live smoke
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://medieval:medieval@127.0.0.1:54329/medieval
          MEDIEVAL_GAME_TOKEN: ci-secret
          PORT: "8080"
        run: |
          nohup npm start > medieval-api.log 2>&1 &
          echo $! > medieval-api.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ready; then
              exit 0
            fi
            sleep 1
          done
          cat medieval-api.log
          exit 1

      - name: Smoke live API
        env:
          MEDIEVAL_GAME_BASE_URL: http://127.0.0.1:8080
          MEDIEVAL_GAME_TOKEN: ci-secret
        run: npm run smoke

      - name: Stop API
        if: always()
        run: |
          if [ -f medieval-api.pid ]; then
            kill "$(cat medieval-api.pid)" || true
          fi
